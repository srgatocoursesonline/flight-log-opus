<!DOCTYPE html>
<html lang="pt-BR">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Microsoft Flight Simulator 2024 - Career Manager</title>
    <meta name="description" content="Gerencie sua carreira no Microsoft Flight Simulator 2024 com registro detalhado de voos, estatísticas e acompanhamento de progressão." />
    <meta name="author" content="FS24 Career Manager" />
    <meta name="theme-color" content="#020817" />

    <!-- iOS standalone -->
    <meta name="mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
    <meta name="apple-mobile-web-app-title" content="MSFS 2024" />

    <!-- PWA Manifest -->
    <link rel="manifest" href="/manifest.json" />
    
    <!-- Icons -->
    <link rel="icon" type="image/png" sizes="32x32" href="/favicon-32.png" />
    <link rel="icon" type="image/png" sizes="192x192" href="/icon-192x192.png" />
    <link rel="icon" type="image/png" sizes="512x512" href="/icon-512x512.png" />
    <link rel="apple-touch-icon" sizes="180x180" href="/apple-touch-icon.png" />

    <!-- Open Graph -->
    <meta property="og:title" content="Flight Simulator 2024 Career Manager" />
    <meta property="og:description" content="Manage your Microsoft Flight Simulator 2024 career mode with detailed flight logging, statistics, and progression tracking." />
    <meta property="og:type" content="website" />
    <meta property="og:image" content="/icon-512x512.png" />

    <!-- Twitter Card -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:image" content="/icon-512x512.png" />
  </head>

  <body>
    <script>
      // Aplicar tema (dark padrão) e modo de UI (clássico padrão) antes do paint
      const theme = localStorage.getItem('flight-log-theme') || 'dark';
      const uiMode = localStorage.getItem('flight-log-ui-mode') === 'new' ? 'new' : 'classic';
      document.documentElement.className = theme + ' ui-' + uiMode;
    </script>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
